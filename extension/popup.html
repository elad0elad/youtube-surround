<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <title>YouTube Surround</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div>
      <h1>YouTube Surround</h1>
      <p id="state">Waiting</p>
    </div>
    <label class="switch">
      <input id="enabled" type="checkbox" checked />
      <span>Enabled</span>
    </label>
  </header>
  <section class="modes">
    <button id="automatic" class="mode on" type="button">Automatic</button>
    <button id="manual" class="mode" type="button">Manual</button>
  </section>
  <label class="output">
    Output
    <select id="output">
      <option value="auto">Auto Detect</option>
      <option value="speakers51">5.1 Speakers</option>
      <option value="atmos">Dolby Atmos Headphones</option>
      <option value="surroundHeadphones">Surround Headphones</option>
      <option value="stereo">Stereo Headphones</option>
    </select>
  </label>
  <p id="route"></p>
  <p id="outputError"></p>
  <section class="actions">
    <button id="start" type="button">Play Surround</button>
    <button id="stop" type="button">Stereo</button>
    <button id="tones" type="button">Test Audio</button>
  </section>
  <p id="detail"></p>
  <details>
    <summary>Advanced information</summary>
    <dl id="advanced"></dl>
  </details>
  <footer>© 2026 elad0elad · MIT</footer>
  <script src="popup.js"></script>
</body>
</html>
